$kind: http-request
name: Create Carrera por Admin (Happy - RBAC)
method: POST
url: '{{baseUrl}}/core/carreras/'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ingeniería en Desarrollo de Software",
      "abreviatura": "IDS",
      "area": 1
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("adminAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201 - Admin crea carrera exitosamente", function () {
          pm.response.to.have.status(201);
      });
