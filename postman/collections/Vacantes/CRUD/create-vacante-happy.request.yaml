$kind: http-request
name: Create Vacante (Happy)
method: POST
url: '{{baseUrl}}/vacantes/'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Desarrollador Backend Python",
      "tipo_contratacion": "tiempo_completo",
      "modalidad": "presencial",
      "num_candidatos": 2,
      "horario_trabajo": "Lunes a Viernes 9:00 a 18:00",
      "nivel_estudios": "ING_LIC",
      "edad": "22 a 35 años",
      "genero": "indistinto",
      "estado_civil": "soltero",
      "es_inclusiva": false,
      "experiencia": "1 año de experiencia en Django o FastAPI",
      "conocimientos": "Python, Django, PostgreSQL, Git",
      "habilidades": "Trabajo en equipo, análisis lógico",
      "actitudes": "Responsabilidad, Proactividad",
      "responsabilidades": "Desarrollo y mantenimiento de APIs REST",
      "sueldo_minimo": "8000.00",
      "sueldo_maximo": "12000.00",
      "salario_a_tratar": false,
      "prestaciones": "Sueldo competitivo, prestaciones de ley",
      "incluye_transporte": false,
      "incluye_comedor": false,
      "documentos_requeridos": "Título o Cédula Profesional",
      "persona_contacto": "Ing. García",
      "area_estudio": 1,
      "idiomas": [
        {"idioma": 1, "nivel": "B2", "obligatorio": false}
      ]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("empresaAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Tiene id, titulo y empresa", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('id');
          pm.expect(json).to.have.property('titulo');
          pm.expect(json).to.have.property('empresa');
      });
      if (pm.response.code === 201) {
          pm.environment.set("vacanteId", pm.response.json().id);
      }
