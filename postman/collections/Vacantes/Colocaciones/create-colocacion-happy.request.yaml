$kind: http-request
name: Create Colocación por Admin (Happy)
method: POST
url: '{{baseUrl}}/vacantes/colocaciones/'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "egresado": {{egresadoId}},
      "vacante": {{vacanteId}},
      "evento": {{eventoId}},
      "observaciones": "Colocación registrada manualmente durante la Feria de Empleo UTH 2026"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("adminAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201 - Colocación creada exitosamente", function () {
          pm.response.to.have.status(201);
      });
      if (pm.response.code === 201) {
          pm.environment.set("colocacionId", pm.response.json().id);
      }
