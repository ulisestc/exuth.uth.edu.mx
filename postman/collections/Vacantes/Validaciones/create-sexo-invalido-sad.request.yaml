$kind: http-request
name: 'Create Vacante: sexo inválido (Sad)'
method: POST
url: '{{baseUrl}}/vacantes/'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Vacante Género Inválido",
      "tipo_contratacion": "tiempo_completo",
      "modalidad": "presencial",
      "num_candidatos": 2,
      "horario_trabajo": "Lunes a Viernes 9:00 a 18:00",
      "nivel_estudios": "ING_LIC",
      "edad": "22 a 35 años",
      "genero": "invalid_gender",
      "estado_civil": "soltero",
      "es_inclusiva": false,
      "experiencia": "1 año de experiencia",
      "conocimientos": "Python, Django",
      "habilidades": "Trabajo en equipo",
      "actitudes": "Responsabilidad",
      "responsabilidades": "Funciones varias",
      "sueldo_minimo": "8000.00",
      "sueldo_maximo": "12000.00",
      "salario_a_tratar": false,
      "prestaciones": "Prestaciones de ley",
      "incluye_transporte": false,
      "incluye_comedor": false,
      "documentos_requeridos": "Identificación oficial",
      "persona_contacto": "Ing. García",
      "area_estudio": 1,
      "idiomas": []
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("empresaAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", function () {
          pm.response.to.have.status(400);
      });
