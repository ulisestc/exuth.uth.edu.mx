$kind: http-request
name: 'Update Vacante: idiomas hard reset (Happy)'
method: PUT
url: '{{baseUrl}}/vacantes/{{vacanteId}}/'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Desarrollador Backend Python Senior",
      "tipo_contratacion": "tiempo_completo",
      "modalidad": "hibrido",
      "num_candidatos": 3,
      "horario_trabajo": "Lunes a Viernes 9:00 a 18:00",
      "nivel_estudios": "ING_LIC",
      "edad": "25 a 40 años",
      "genero": "indistinto",
      "estado_civil": "soltero",
      "es_inclusiva": false,
      "experiencia": "3 años de experiencia en Django o FastAPI",
      "conocimientos": "Python, Django, FastAPI, PostgreSQL, Docker, Git",
      "habilidades": "Liderazgo, arquitectura de software",
      "actitudes": "Responsabilidad, Proactividad",
      "responsabilidades": "Desarrollo y mantenimiento de APIs REST y microservicios",
      "sueldo_minimo": "12000.00",
      "sueldo_maximo": "18000.00",
      "salario_a_tratar": false,
      "prestaciones": "Sueldo competitivo, prestaciones de ley, home office",
      "incluye_transporte": false,
      "incluye_comedor": false,
      "documentos_requeridos": "Título o Cédula Profesional",
      "persona_contacto": "Ing. García",
      "area_estudio": 1,
      "idiomas": [
        {"idioma": 1, "nivel": "C2", "obligatorio": true}
      ]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("empresaAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Idiomas actualizados (hard reset)", function () {
          var json = pm.response.json();
          pm.expect(json.requisitos_idioma).to.be.an('array');
          pm.expect(json.requisitos_idioma.length).to.eql(1);
          pm.expect(json.requisitos_idioma[0].nivel).to.eql("C2");
      });
