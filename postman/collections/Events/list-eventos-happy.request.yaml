$kind: http-request
name: List Eventos (Happy)
method: GET
url: '{{baseUrl}}/events/'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("egresadoAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response es paginado y tiene eventos", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('results');
          pm.expect(json.results).to.be.an('array');
      });
