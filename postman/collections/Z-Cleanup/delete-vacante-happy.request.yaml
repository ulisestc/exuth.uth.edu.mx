$kind: http-request
name: Delete Vacante (Happy)
method: DELETE
url: '{{baseUrl}}/vacantes/{{vacanteId}}/'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("empresaAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 204", function () {
          pm.response.to.have.status(204);
      });
