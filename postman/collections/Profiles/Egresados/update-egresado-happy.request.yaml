$kind: http-request
name: Update Egresado (Happy)
method: PUT
url: '{{baseUrl}}/profiles/egresados/{{egresadoId}}/'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "matricula": "UTH2021001",
      "curp": "ABCD123456HDFXXX01",
      "telefono_celular": "7719999999",
      "telefono_casa": "7717654321",
      "domicilio": "Av. Universidad #456, Pachuca, Hidalgo",
      "nivel_estudios": "ING_LIC",
      "genero": "M",
      "habilidades": "Desarrollo Python, Django, PostgreSQL, React",
      "carrera": 1
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("egresadoAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
