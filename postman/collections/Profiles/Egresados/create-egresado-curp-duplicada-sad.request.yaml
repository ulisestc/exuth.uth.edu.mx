$kind: http-request
name: Create Egresado CURP Duplicada (Sad)
method: POST
url: '{{baseUrl}}/profiles/egresados/'
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "matricula": "UTH2021002",
      "curp": "ABCD123456HDFXXX01",
      "telefono_celular": "7711234568",
      "domicilio": "Calle Falsa #123, Pachuca, Hidalgo",
      "nivel_estudios": "ING_LIC",
      "genero": "F",
      "habilidades": "Testing",
      "carrera": 1
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("egresadoAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Response contains CURP error", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('curp');
      });
