$kind: http-request
name: Create Vacante Empresa Pendiente (Sad - RBAC)
method: POST
url: '{{baseUrl}}/vacantes/'
order: 7150
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Vacante Empresa No Aprobada",
      "tipo_contratacion": "tiempo_completo",
      "modalidad": "presencial",
      "num_candidatos": 2,
      "horario_trabajo": "Lunes a Viernes 9:00 a 18:00",
      "nivel_estudios": "ING_LIC",
      "edad": "22 a 35 años",
      "genero": "indistinto",
      "estado_civil": "indistinto",
      "es_inclusiva": false,
      "experiencia": "Testing",
      "conocimientos": "Testing",
      "habilidades": "Testing",
      "actitudes": "Responsabilidad",
      "responsabilidades": "Desarrollo",
      "sueldo_minimo": "8000.00",
      "sueldo_maximo": "12000.00",
      "salario_a_tratar": false,
      "prestaciones": "De ley",
      "incluye_transporte": false,
      "incluye_comedor": false,
      "documentos_requeridos": "Identificación oficial",
      "persona_contacto": "Ing. Test",
      "area_estudio": 1,
      "idiomas": []
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("empresaAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403 - Empresa pendiente no puede crear vacante", function () {
          pm.response.to.have.status(403);
      });
