$kind: http-request
name: Get Reporte Colocaciones Excel por Admin (Happy)
method: GET
url: '{{baseUrl}}/reports/colocaciones/?format=excel'
order: 1300
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("accessToken", pm.environment.get("adminAccessToken"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Reporte Excel generado", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Header Content-Type es un archivo de hoja de calculo", function () {
          var contentType = pm.response.headers.get("Content-Type");
          pm.expect(contentType).to.include("spreadsheetml");
      });
